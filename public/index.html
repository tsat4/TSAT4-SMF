<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TSAT4 SMF</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <section class="login-shell" id="login">
    <button class="theme-toggle login-theme" type="button" data-theme-login title="สลับโหมดมืด/สว่าง" aria-label="สลับธีม">
      <span class="material-symbols-rounded login-theme-icon">light_mode</span>
    </button>
    <form class="login-card" id="login-form">
      <div class="login-head">
        <div class="login-mark material-symbols-rounded">inventory_2</div>
        <h1>TSAT4 SMF</h1>
        <p>ระบบงานและกิจกรรม</p>
      </div>
      <div class="field"><label class="required">รหัสพนักงาน</label><input name="employeeId" autocomplete="username" required></div>
      <div class="field"><label class="required">รหัสผ่าน</label>
        <div class="pw-wrap">
          <input name="password" type="password" autocomplete="current-password" required>
          <button class="icon-btn pw-toggle" type="button" data-pw-toggle title="แสดงรหัสผ่าน" aria-label="แสดงรหัสผ่าน"><span class="material-symbols-rounded">visibility</span></button>
        </div>
      </div>
      <p class="form-error" id="login-error"></p>
      <div class="form-actions">
        <button class="btn btn-primary" type="submit">เข้าสู่ระบบ</button>
      </div>
    </form>
  </section>

  <section class="login-shell d-none" id="password-gate">
    <button class="theme-toggle login-theme" type="button" data-theme-login title="สลับโหมดมืด/สว่าง" aria-label="สลับธีม">
      <span class="material-symbols-rounded login-theme-icon">light_mode</span>
    </button>
    <form class="login-card" id="password-form">
      <div class="login-head">
        <div class="login-mark material-symbols-rounded">lock_reset</div>
        <h1>เปลี่ยนรหัสผ่าน</h1>
        <p>ครบกำหนด 90 วัน ตั้งรหัสใหม่ก่อนใช้งานต่อ อย่างน้อย 8 ตัว</p>
      </div>
      <div class="field"><label class="required">รหัสผ่านเดิม</label>
        <div class="pw-wrap">
          <input name="current" type="password" autocomplete="current-password" required>
          <button class="icon-btn pw-toggle" type="button" data-pw-toggle title="แสดงรหัสผ่าน" aria-label="แสดงรหัสผ่าน"><span class="material-symbols-rounded">visibility</span></button>
        </div>
      </div>
      <div class="field"><label class="required">รหัสผ่านใหม่</label>
        <div class="pw-wrap">
          <input name="password" type="password" autocomplete="new-password" minlength="8" required>
          <button class="icon-btn pw-toggle" type="button" data-pw-toggle title="แสดงรหัสผ่าน" aria-label="แสดงรหัสผ่าน"><span class="material-symbols-rounded">visibility</span></button>
        </div>
      </div>
      <p class="form-error" id="password-error"></p>
      <div class="form-actions">
        <button class="btn btn-secondary" type="button" id="password-logout">ออกจากระบบ</button>
        <button class="btn btn-primary" type="submit">บันทึกรหัสใหม่</button>
      </div>
    </form>
  </section>

  <div class="d-none" id="shell">
    <header class="app-header">
      <div class="header-left">
        <button class="icon-btn sidebar-toggle" type="button" id="sidebar-toggle" aria-label="ย่อ/ขยายเมนู" title="ย่อ/ขยายเมนู">
          <span id="sidebar-toggle-icon" class="material-symbols-rounded">left_panel_close</span>
        </button>
        <div class="brand"><span>TSAT4 SMF</span></div>
      </div>
      <div class="header-page">
        <strong id="header-page-title">ภาพรวม</strong>
        <span id="header-page-subtitle">ระบบเบิก Usage</span>
      </div>
      <div class="header-right">
        <button class="theme-toggle" type="button" id="theme-toggle" title="สลับโหมดมืด/สว่าง" aria-label="สลับธีม">
          <span id="theme-icon" class="material-symbols-rounded">light_mode</span>
        </button>
        <div class="user-menu" id="user-menu">
          <button class="user-avatar" type="button" id="user-menu-btn" aria-label="ผู้ใช้">
            <span class="material-symbols-rounded">person</span>
          </button>
          <div class="user-pop">
            <strong id="header-user"></strong>
            <span id="header-role"></span>
            <button class="btn btn-secondary" type="button" id="logout">ออกจากระบบ</button>
          </div>
        </div>
      </div>
    </header>
    <aside class="sidebar" id="sidebar">
      <button class="nav-btn" data-view="main" title="TSAT4 SMF"><span class="material-symbols-rounded">home</span><span>หน้าหลัก</span></button>
      <div class="nav-acc" data-nav-acc="work">
        <div class="nav-split">
          <button class="nav-btn nav-parent" type="button" data-view="work" title="Work System">
            <span class="material-symbols-rounded">work</span><span>ระบบงาน</span>
          </button>
          <button class="nav-caret-btn" type="button" data-nav-toggle="work" aria-expanded="true" aria-label="ย่อระบบงาน" title="ย่อ/ขยาย">
            <span class="material-symbols-rounded nav-caret">expand_more</span>
          </button>
        </div>
        <div class="nav-sub" data-nav-panel="work">
          <div class="nav-acc" data-nav-acc="store">
            <div class="nav-split">
              <button class="nav-btn nav-parent" type="button" data-view="store" title="Store">
                <span class="material-symbols-rounded">warehouse</span><span>Store</span>
              </button>
              <button class="nav-caret-btn" type="button" data-nav-toggle="store" aria-expanded="true" aria-label="ย่อ Store" title="ย่อ/ขยาย">
                <span class="material-symbols-rounded nav-caret">expand_more</span>
              </button>
            </div>
            <div class="nav-sub" data-nav-panel="store">
              <div class="nav-acc" data-nav-acc="usage">
                <div class="nav-split">
                  <button class="nav-btn nav-parent" type="button" data-view="home" title="Usage">
                    <span class="material-symbols-rounded">inventory_2</span><span>Usage</span>
                  </button>
                  <button class="nav-caret-btn" type="button" data-nav-toggle="usage" aria-expanded="true" aria-label="ย่อ Usage" title="ย่อ/ขยาย">
                    <span class="material-symbols-rounded nav-caret">expand_more</span>
                  </button>
                </div>
                <div class="nav-sub" data-nav-panel="usage">
                  <button class="nav-btn" data-view="home" data-usage="1" title="Dashboard"><span class="material-symbols-rounded">monitoring</span><span>Dashboard</span></button>
                  <button class="nav-btn" data-view="edit" data-usage="1" title="transaction"><span class="material-symbols-rounded">edit_note</span><span>transaction</span></button>
                  <button class="nav-btn" data-view="setting" data-usage="3" title="Setting"><span class="material-symbols-rounded">settings</span><span>Setting</span></button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="nav-acc" data-nav-acc="activity">
        <div class="nav-split">
          <button class="nav-btn nav-parent" type="button" data-view="activity" title="Activity">
            <span class="material-symbols-rounded">event</span><span>ระบบกิจกรรม</span>
          </button>
          <button class="nav-caret-btn" type="button" data-nav-toggle="activity" aria-expanded="true" aria-label="ย่อระบบกิจกรรม" title="ย่อ/ขยาย">
            <span class="material-symbols-rounded nav-caret">expand_more</span>
          </button>
        </div>
        <div class="nav-sub" data-nav-panel="activity"></div>
      </div>
      <div class="nav-system d-none" data-system="1">
        <button class="nav-btn" data-view="system" title="Setting"><span class="material-symbols-rounded">settings</span><span>Setting</span></button>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <main class="main">
      <div class="app-view" id="app-view"></div>
    </main>
  </div>
  <div class="toast-stack" id="toasts"></div>
  <!-- Load order matters: core first, boot last. All scripts share one global scope. -->
  <script src="/js/core.js"></script>
  <script src="/js/sto.js"></script>
  <script src="/js/units.js"></script>
  <script src="/js/system.js"></script>
  <script src="/js/boot.js"></script>
</body>
</html>
